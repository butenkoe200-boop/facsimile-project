# Travel Pay — production Nginx.
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/travel-pay
#   sudo ln -sf /etc/nginx/sites-available/travel-pay /etc/nginx/sites-enabled/travel-pay
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Замените YOUR_DOMAIN.RU на свой домен.

upstream travel_pay_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.RU www.YOUR_DOMAIN.RU;

    # Оставляем для обновления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN.RU www.YOUR_DOMAIN.RU;

    # Сертификаты подставит certbot (см. DEPLOYMENT.md)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.RU/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.RU/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Устойчивость к проблемам PMTU у российских провайдеров/туннелей
    # (не заменяет iptables TCPMSS-кламп, но снижает риск чёрных дыр)
    ssl_buffer_size 4k;

    # Security headers (без CSP, чтобы не ломать приложение)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2 application/manifest+json;

    # Иммутабельные ассеты сборки (JS/CSS с хешами)
    location /_build/ {
        proxy_pass http://travel_pay_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Локальные шрифты
    location /fonts/ {
        proxy_pass http://travel_pay_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN.RU";
    }

    # SSR + все маршруты + серверные функции (/_serverFn) + /api
    location / {
        proxy_pass http://travel_pay_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE (на случай будущего использования)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Требуется для проброса Upgrade; при конфликте вынесите в /etc/nginx/conf.d/upgrade.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
